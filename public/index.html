<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0C0A16" />
  <title>TEMPO — pro Olivera</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 17l4-9 4 6 3-4 5 7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="4" cy="17" r="2.4" fill="#fff"/></svg>
      </div>
      <div>
        <h1>TEMPO</h1>
        <div class="sub">pro Olivera</div>
      </div>
    </div>

    <!-- UPLOAD -->
    <section id="uploader">
      <label class="drop" id="drop" for="file">
        <div class="em">📥</div>
        <h2>Nahraj jízdu z Garminu</h2>
        <p>Přetáhni sem soubor nebo klikni</p>
        <div class="fmt">.fit · .tcx · .gpx</div>
      </label>
      <input type="file" id="file" accept=".fit,.tcx,.gpx" />
      <div class="hint">Vyexportuj aktivitu z Garmin Connectu a nahraj ji sem.</div>
      <div class="msg" id="msg"></div>
    </section>

    <!-- RESULT -->
    <section class="result" id="result">
      <div class="top">
        <div class="title" id="title">Aktivita<small id="subtitle"></small></div>
        <div class="rating" id="rating"></div>
      </div>

      <div class="card grad">
        <div class="metrics" id="metrics"></div>
      </div>

      <div class="card">
        <div class="coach">
          <div class="avatar" aria-hidden="true">🧠</div>
          <div class="bubble" id="headline"></div>
        </div>
      </div>

      <div class="card" id="zonesCard">
        <div class="lbl" style="margin-bottom:9px">Tep v zónách</div>
        <div class="zones">
          <div class="zonebar" id="zonebar"></div>
          <div class="zonelegend"><span>Z1 regenerace</span><span>Z3 tempo</span><span>Z5 max</span></div>
        </div>
      </div>

      <div class="card" id="listsCard">
        <div class="lists" id="lists"></div>
      </div>

      <div class="chips" id="chips" style="margin-bottom:14px"></div>

      <button class="again" id="again">↺ Nahrát další aktivitu</button>
    </section>

    <div class="foot">TEMPO · v0.1 · tréninkový parťák</div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
